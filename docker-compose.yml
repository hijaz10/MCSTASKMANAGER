version: '3.8'

services:
  mongo:
    image: mongodb/mongodb-enterprise-server:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  user-service:
    build: ./User_service
    container_name: user_service
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - rabbitmq

  task-service:
    build: ./Task_service
    container_name: Task_service
    ports:
      - "3001:3001"
    depends_on:
      - mongo
      - rabbitmq
  notification-service:
    build: ./Noti_services
    container_name: Noti_services
    ports:
      - "3002:3002"
    depends_on:
      - mongo
      - rabbitmq

volumes:
  mongo_data:
  rabbitmq_data:
