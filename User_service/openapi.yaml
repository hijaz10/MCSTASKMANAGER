openapi: 3.0.3
info:
  title: User Service API
  description: Registration, login and user listing.
  version: 1.0.0

servers:
  - url: /

paths:
  /api/v1/auth/users:
    post:
      tags: [Users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Ada Lovelace
                email:
                  type: string
                  example: ada@example.com
                password:
                  type: string
                  example: password123
      responses:
        "201":
          description: User created
        "400":
          description: Validation failed
        "409":
          description: Email already registered

    get:
      tags: [Users]
      summary: List all users (requires a token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
        "401":
          description: Missing or invalid token

  /api/v1/auth/login:
    post:
      tags: [Users]
      summary: Log in and get a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: ada@example.com
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: Login successful, returns a token
        "400":
          description: Invalid email or password

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
