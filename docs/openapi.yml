openapi: 3.0.3
info:
  title: MCS Task Manager API
  version: 1.0.0
  description: |
    REST API for the MCS Task Manager microservices.

    * **User service** (port 3000): registration, login and user listing.
    * **Task service** (port 3001): task CRUD. It publishes a `task_created` event to RabbitMQ, which the notification service turns into an email.

    **Authentication:** the User service issues a JWT on login. Send it as
    `Authorization: Bearer <token>` on protected endpoints. The Task service
    does not require authentication yet.

servers:
  - url: http://localhost:3000
    description: User service (local)
  - url: http://localhost:3001
    description: Task service (local)

tags:
  - name: Users
    description: Registration, login and user listing (User service)
  - name: Tasks
    description: Task management (Task service)

paths:
  /api/v1/auth/users:
    servers:
      - url: http://localhost:3000
        description: User service (local)
    post:
      tags: [Users]
      operationId: registerUser
      summary: Register a new user
      description: |
        Creates a user. The email is trimmed and lowercased before the duplicate
        check. The password is hashed with bcrypt and never returned.

        Rate limit: 10 requests per 15 minutes per IP (shared with login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Email already registered
        "413":
          description: Request body is too large
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Users]
      operationId: listUsers
      summary: List all users
      description: Returns every user without password hashes. Requires a valid JWT.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/login:
    servers:
      - url: http://localhost:3000
        description: User service (local)
    post:
      tags: [Users]
      operationId: loginUser
      summary: Log in and receive a JWT
      description: |
        The same error message is returned for an unknown email and a wrong
        password, so the API does not reveal which emails exist.

        Rate limit: 10 requests per 15 minutes per IP (shared with registration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid credentials, or the request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  summary: Wrong email or password
                  value:
                    error: Invalid email or password
                validationFailed:
                  summary: Body failed validation
                  value:
                    error: Validation failed
                    details:
                      - field: password
                        message: Password is required
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/tasks/task:
    servers:
      - url: http://localhost:3001
        description: Task service (local)
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: |
        Saves the task and publishes a `task_created` message to RabbitMQ.
        If `userEmail` is provided, the notification service emails that address.

        The task is saved **before** the RabbitMQ check, so a `503` response can
        still leave a saved task.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTaskResponse"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: RabbitMQ is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: RabbitMQ not connected

    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List all tasks
      security: []
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /api/v1/tasks/task/{id}:
    servers:
      - url: http://localhost:3001
        description: Task service (local)
    parameters:
      - $ref: "#/components/parameters/TaskId"
    put:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task's title and description
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateTaskResponse"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      security: []
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: Task deleted successfully
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by `POST /api/v1/auth/login`

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the task
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
      example: 665f1c2e8b1e4a0012345678

  responses:
    ValidationError:
      description: The request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Validation failed
            details:
              - field: email
                message: Invalid email address
              - field: password
                message: Password must be at least 8 characters
    Unauthorized:
      description: Missing, malformed, invalid or expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              summary: No token sent
              value:
                error: Authentication required
            invalid:
              summary: Bad or expired token
              value:
                error: Invalid or expired token
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Too many attempts, please try again later
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Internal server error
    TaskNotFound:
      description: No task with this id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Task not found

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Ada Lovelace
        email:
          type: string
          format: email
          maxLength: 254
          example: ada@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: ada@example.com
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          example: password123

    PublicUser:
      type: object
      properties:
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com

    RegisterResponse:
      type: object
      properties:
        Message:
          type: string
          example: Registration was succesfull
        user:
          $ref: "#/components/schemas/PublicUser"

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        token:
          type: string
          description: JWT to send in the Authorization header
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/PublicUser"

    UserListItem:
      type: object
      properties:
        _id:
          type: string
          example: 665f1c2e8b1e4a0012345678
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com

    CreateTaskRequest:
      type: object
      required: [title, description, userId]
      properties:
        title:
          type: string
          example: Write docs
        description:
          type: string
          example: README and technical documentation
        userId:
          type: string
          example: 665f1c2e8b1e4a0012345678
        userEmail:
          type: string
          format: email
          description: Optional. If present, the notification service emails this address.
          example: ada@example.com

    CreateTaskResponse:
      type: object
      properties:
        message:
          type: string
          example: Task added successfully
        task:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            userId:
              type: string
            userEmail:
              type: string
              format: email

    UpdateTaskRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          example: Write the README
        description:
          type: string
          example: Include setup and API overview

    UpdateTaskResponse:
      type: object
      properties:
        message:
          type: string
          example: Task updated successfully
        task:
          $ref: "#/components/schemas/Task"

    Task:
      type: object
      properties:
        _id:
          type: string
          example: 665f1c2e8b1e4a0012345678
        title:
          type: string
          example: Write docs
        description:
          type: string
          example: README and technical documentation
        userId:
          type: string
          example: 665f1c2e8b1e4a0012345678
        createdAt:
          type: string
          description: Timestamp stored as a string (current behavior)
          example: "1732100000000"

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Internal server error
        details:
          type: array
          description: Present only for validation errors
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email address
