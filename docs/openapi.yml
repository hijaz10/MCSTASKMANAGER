openapi: 3.0.3
info:
  title: MCS Task Manager API
  description: User service runs on port 3000, Task service runs on port 3001.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: User service
  - url: http://localhost:3001
    description: Task service

paths:
  /api/v1/auth/users:
    post:
      tags: [Users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Ada Lovelace
                email:
                  type: string
                  example: ada@example.com
                password:
                  type: string
                  example: password123
      responses:
        "201":
          description: User created
        "400":
          description: Validation failed
        "409":
          description: Email already registered

    get:
      tags: [Users]
      summary: List all users (requires a token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
        "401":
          description: Missing or invalid token

  /api/v1/auth/login:
    post:
      tags: [Users]
      summary: Log in and get a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: ada@example.com
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: Login successful, returns a token
        "400":
          description: Invalid email or password

  /api/v1/tasks/task:
    servers:
      - url: http://localhost:3001
    post:
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, userId]
              properties:
                title:
                  type: string
                  example: Write docs
                description:
                  type: string
                  example: README and technical docs
                userId:
                  type: string
                  example: user-1
                userEmail:
                  type: string
                  example: ada@example.com
      responses:
        "201":
          description: Task created
        "503":
          description: RabbitMQ not connected

    get:
      tags: [Tasks]
      summary: List all tasks
      responses:
        "200":
          description: List of tasks

  /api/v1/tasks/task/{id}:
    servers:
      - url: http://localhost:3001
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Tasks]
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: New title
                description:
                  type: string
                  example: New description
      responses:
        "200":
          description: Task updated
        "404":
          description: Task not found

    delete:
      tags: [Tasks]
      summary: Delete a task
      responses:
        "200":
          description: Task deleted
        "404":
          description: Task not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
